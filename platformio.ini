[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -D CORE_DEBUG_LEVEL=0
; Web pages served by the firmware, embedded as null-terminated strings (see main.cpp).
board_build.embed_txtfiles =
  web/index.html
  web/advanced.html
  web/app.css
  web/app.js
